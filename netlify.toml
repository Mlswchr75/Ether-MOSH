[[redirects]]
  from = "https://ether-mosh.netlify.app/*"
  to = "https://ether-mosh.online/:splat"
  status = 301
  force = true

# The production-branch alias Netlify auto-generates (<branch>--<site>.netlify.app)
# is a second public hostname for the exact same live deploy, distinct from
# ether-mosh.netlify.app above and not matched by that rule — confirmed live via
# curl, it was serving the site directly instead of redirecting. Deploy-preview
# and other branch-deploy subdomains are deliberately NOT covered by a wildcard
# here; those need to stay independently viewable for testing.
[[redirects]]
  from = "https://ether-mosh--ether-mosh.netlify.app/*"
  to = "https://ether-mosh.online/:splat"
  status = 301
  force = true

# Belt-and-suspenders: refuse any .map file even if one is ever
# accidentally reintroduced (build.sourcemap in vite.config.ts is the
# actual fix — this just backstops it at the edge).
[[redirects]]
  from = "/*.map"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# script-src: 'wasm-unsafe-eval' is for MediaPipe's segmentation WASM
# (SegmentationEngine.ts), not general eval; cdn.jsdelivr.net is that
# same WASM runtime's loader/binary host. No 'unsafe-inline' here — the
# build's only inline <script> tags are inert application/ld+json, which
# CSP's script-src never governs.
# style-src: 'unsafe-inline' is required by the Netlify inline-critical-css
# plugin, which inlines a real <style> block into every page.
# img-src: cdn.shopify.com is the demo reel — public/demo-reel.json is 522
# product photos from the real Shopify store, fetched at runtime by
# DemoReelPanel, not bundled at build time (so grepping src/ alone misses it).
# connect-src: Supabase (data + edge functions, http and ws), Stripe's
# API, and the same MediaPipe hosts above (model/wasm fetch, not just
# script load).
# frame-src: Stripe embedded checkout, Stripe.js, 3-D Secure, and Link payment frames.
[[headers]]
  for = "/news/feed.xml"
  [headers.values]
    Content-Type = "application/rss+xml; charset=UTF-8"
    Cache-Control = "public, max-age=900"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = '''
      default-src 'self';
      script-src 'self' https://js.stripe.com https://*.js.stripe.com https://checkout.stripe.com https://cdn.jsdelivr.net 'wasm-unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob: https://cdn.shopify.com https://*.stripe.com https://*.link.com;
      media-src 'self' blob:;
      connect-src 'self' https://coyzusnfkvheplcdvctf.supabase.co wss://coyzusnfkvheplcdvctf.supabase.co https://api.stripe.com https://checkout.stripe.com https://link.com https://*.link.com https://cdn.jsdelivr.net https://storage.googleapis.com https://cdn.shopify.com;
      frame-src https://js.stripe.com https://*.js.stripe.com https://checkout.stripe.com https://hooks.stripe.com https://link.com https://*.link.com;
      worker-src 'self' blob:;
      manifest-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'self';
      frame-ancestors 'none';
      upgrade-insecure-requests;
    '''
    X-Content-Type-Options = "nosniff"
    X-Permitted-Cross-Domain-Policies = "none"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), usb=(), browsing-topics=()"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Forge Journey is the only intentionally embeddable app surface. Keep the
# main product's frame-ancestors lock while allowing this isolated visual
# renderer to live inside portfolios, blogs, stream overlays, and installations.
[[headers]]
  for = "/embed/journey"
  [headers.values]
    Content-Security-Policy = '''
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: blob:;
      connect-src 'self';
      worker-src 'self' blob:;
      manifest-src 'none';
      object-src 'none';
      base-uri 'none';
      form-action 'none';
      frame-ancestors *;
      upgrade-insecure-requests;
    '''
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), usb=(), browsing-topics=()"

[[headers]]
  for = "/journey-portal.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Content-Type = "text/javascript; charset=utf-8"
